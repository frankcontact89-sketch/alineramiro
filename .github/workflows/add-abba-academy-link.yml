name: Link ABBA Academy portal
on:
  push:
    paths:
      - '.github/workflows/add-abba-academy-link.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add academy link to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<article class="card"><h3>ABBA Academy</h3><p data-t="abbaText"></p></article>'
          new='<article class="card"><h3><a href="/academy.html">ABBA Academy</a></h3><p data-t="abbaText"></p><p><a href="/academy.html" style="color:#1765d1;font-weight:900">Student Portal →</a></p></article>'
          if old not in s:
              raise SystemExit('Expected ABBA Academy card not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/add-abba-academy-link.yml
      - name: Commit homepage link
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-abba-academy-link.yml
          git commit -m 'Add ABBA Academy student portal link'
          git push