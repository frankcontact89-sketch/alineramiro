name: Fix mobile menu navigation
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-menu-navigation.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize mobile menu navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<a href="/academy.html" style="color:#1765d1">Student Portal →</a>'
          new='<a href="/academy.html">Student Portal →</a>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('Student Portal mobile link not found')
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "frankcontact89-sketch"
          git config user.email "frankcontact89@gmail.com"
          git add index.html
          git commit -m "Make mobile menu links visually consistent" || exit 0
          git push
