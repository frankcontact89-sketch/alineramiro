<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ABBA Academy | Admin</title><meta name="description" content="ABBA Academy course administration."><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f3ee;color:#1d1d1d}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#181818;color:#fff}.top a{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08);margin-bottom:18px}.hidden{display:none!important}label{display:block;margin:12px 0;font-weight:600}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#ece7df}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.lessonList{max-height:70vh;overflow:auto}.lessonItem{width:100%;text-align:left;padding:12px;border:1px solid #ddd;background:#fff;border-radius:10px;margin-bottom:8px}.lessonItem.active{border-color:#111}.status{margin-top:10px;font-size:14px}.uploadBox{border:2px dashed #bbb;border-radius:14px;padding:20px;margin-top:14px}.bar{height:10px;background:#eee;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#111;width:0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:13px;color:#666}@media(max-width:760px){.grid{grid-template-columns:1fr}.lessonList{max-height:300px}}</style></head><body><header class="top"><a href="/">ALINE RAMIRO</a><strong>ABBA Academy Admin</strong><button id="logout" class="btn secondary hidden">Sign out</button></header><main class="wrap"><section id="loginCard" class="card"><h1>Admin access</h1><p>Sign in with an authorized ABBA Academy administrator account.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="8" required></label><button class="btn primary" type="submit">Sign in</button><p id="loginStatus" class="status"></p></form></section><section id="adminView" class="hidden"><div class="card"><h1>Course manager</h1><p class="small">Manage lesson details, upload videos directly to Mux, and publish lessons when the video is ready.</p></div><div class="grid"><aside class="card lessonList"><h2>48 Lessons</h2><div id="lessons"></div></aside><section class="card"><div id="empty">Select a lesson to edit.</div><div id="editor" class="hidden"><h2 id="heading"></h2><label>Title<input id="title"></label><label>Description<textarea id="description"></textarea></label><label>Release date & time<input id="releaseAt" type="datetime-local"></label><div class="row"><button id="saveMeta" class="btn secondary">Save lesson details</button></div><div class="uploadBox"><h3>Video</h3><p id="videoState" class="small">No video attached.</p><input id="videoFile" type="file" accept="video/*"><button id="uploadBtn" class="btn primary" style="margin-top:12px">Upload video to Mux</button><div id="progressWrap" class="hidden" style="margin-top:14px"><div class="bar"><i id="progressBar"></i></div><p id="uploadStatus" class="status"></p></div></div></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="academy-admin.js"></script></body></html>
