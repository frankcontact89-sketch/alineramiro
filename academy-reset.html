<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ABBA Academy | Reset Password</title><meta name="description" content="Reset your ABBA Academy password."><link rel="stylesheet" href="academy.css"></head><body><header class="topbar"><a class="brand" href="/academy.html">← Back</a><span>ABBA Academy</span></header><main class="shell"><section class="card auth-card"><div class="eyebrow">ABBA Academy</div><h1>Reset Password</h1><p>Enter a new password for your student account.</p><form id="resetForm"><label>New password<div style="position:relative"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required style="padding-right:88px"><button id="toggleNew" type="button" style="position:absolute;right:10px;top:16px;border:0;background:transparent;color:#1765d1;font-weight:900;padding:10px;cursor:pointer">Show</button></div></label><label>Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary" type="submit">Save new password</button><p id="resetStatus" class="status" aria-live="polite"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yecywtxbuhfukergbwfc.supabase.co','sb_publishable_jFIuvZYIs1b-6IjqCnDPDw_BDivhFKs');const $=id=>document.getElementById(id);function status(m,b=false){$('resetStatus').textContent=m;$('resetStatus').style.color=b?'#b42318':'#12805c'}$('toggleNew').onclick=()=>{const i=$('newPassword'),v=i.type==='text';i.type=v?'password':'text';$('toggleNew').textContent=v?'Show':'Hide'};$('resetForm').onsubmit=async e=>{e.preventDefault();const p=$('newPassword').value,c=$('confirmPassword').value;if(p.length<8){status('Password must have at least 8 characters.',true);return}if(p!==c){status('Passwords do not match.',true);return}status(
