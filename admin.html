<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aline Ramiro | Administração</title><meta name="robots" content="noindex,nofollow"><style>:root{--navy:#061525;--blue:#1765d1;--soft:#f3f7fc;--ink:#0b1b2d;--text:#526579;--border:#d7e2ed;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--soft);color:var(--ink)}header{background:var(--navy);color:#fff;padding:20px}.wrap{width:min(1050px,92%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--border)}.btn.danger{background:var(--red)}main{padding:28px 0 70px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px;font:inherit}textarea{min-height:140px}.status{padding:11px 12px;border-radius:8px;background:#eef5ff;margin:12px 0}.hidden{display:none}.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}.item img{width:72px;height:72px;object-fit:cover;border-radius:8px}.small{font-size:13px;color:var(--text)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#fff;border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-weight:800}.tab.active{background:var(--navy);color:#fff}.section{display:none}.section.active{display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.item{grid-template-columns:58px 1fr}.item img{width:58px;height:58px}.item .btn{grid-column:1/-1}}</style></head><body><header><div class="wrap top"><div><div style="font-weight:950;letter-spacing:4px">ALINE RAMIRO</div><div style="font-size:11px;color:#8fc0ff;letter-spacing:2px">ADMINISTRAÇÃO</div></div><div><a class="btn secondary" href="/">Ver website</a> <button id="logout" class="btn danger hidden">Sair</button></div></div></header><main class="wrap"><section id="loginBox" class="panel"><h2>Acesso administrativo</h2><p class="small">Acesso exclusivo para o e-mail administrativo configurado.</p><div class="grid"><div><label>E-mail</label><input id="email" type="email" value="alineramirocontact@gmail.com" readonly></div><div><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap"><button id="signIn" class="btn">Entrar</button><button id="signUp" class="btn secondary">Criar acesso pela primeira vez</button></div><div id="authStatus" class="status hidden"></div></section><section id="app" class="hidden"><div class="tabs"><button class="tab active" data-section="content">Conteúdo</button><button class="tab" data-section="media">Fotos</button><button class="tab" data-section="books">Livros</button><button class="tab" data-section="products">Produtos</button></div><section id="content" class="section active panel"><h2>Conteúdo do website</h2><div class="grid"><div class="full"><label>Cargos / apresentação</label><input id="hero_roles_pt"></div><div class="full"><label>Biografia</label><textarea id="bio_pt"></textarea></div><div class="full"><label>Título da área de treinamentos</label><input id="training_title_pt"></div><div class="full"><label>Texto da área de treinamentos</label><textarea id="training_body_pt"></textarea></div><div><label>Texto do botão</label><input id="training_cta_pt"></div><div><label>E-mail de contato</label><input id="contact_email" type="email"></div><div class="full"><label>Texto de contato</label><textarea id="training_contact_pt" style="min-height:90px"></textarea></div></div><button id="saveContent" class="btn" style="margin-top:14px">Salvar conteúdo</button><div id="contentStatus" class="status hidden"></div></section><section id="media" class="section panel"><h2>Fotos</h2><div class="grid"><div class="full"><label>Arquivo de imagem</label><input id="mediaFile" type="file" accept="image/*"></div><div><label>Título</label><input id="mediaTitle"></div><div><label>Onde aparecer</label><select id="mediaPlacement"><option value="gallery">Galeria</option><option value="hero">Foto principal</option></select></div><div class="full"><label>Descrição para Google / acessibilidade</label><input id="mediaAlt"></div></div><button id="uploadMedia" class="btn" style="margin-top:14px">Enviar e publicar foto</button><div id="mediaStatus" class="status hidden"></div><div id="mediaList"></div></section><section id="books" class="section panel"><h2>Livros</h2><div class="grid"><div><label>Título</label><input id="bookTitle"></div><div><label>Subtítulo</label><input id="bookSubtitle"></div><div class="full"><label>Descrição</label><textarea id="bookDescription" style="min-height:100px"></textarea></div><div><label>Link de compra</label><input id="bookUrl" type="url"></div><div><label>Capa</label><input id="bookFile" type="file" accept="image/*"></div></div><button id="addBook" class="btn" style="margin-top:14px">Adicionar livro</button><div id="bookStatus" class="status hidden"></div><div id="bookList"></div></section><section id="products" class="section panel"><h2>Produtos</h2><div class="grid"><div><label>Nome</label><input id="productName"></div><div><label>Preço</label><input id="productPrice"></div><div class="full"><label>Descrição</label><textarea id="productDescription" style="min-height:100px"></textarea></div><div><label>Link de compra</label><input id="productUrl" type="url"></div><div><label>Imagem</label><input id="productFile" type="file" accept="image/*"></div></div><button id="addProduct" class="btn" style="margin-top:14px">Adicionar produto</button><div id="productStatus" class="status hidden"></div><div id="productList"></div></section></section></main><script>
const URL='https://yecywtxbuhfukergbwfc.supabase.co',KEY='sb_publishable_jFIuvZYIs1b-6IjqCnDPDw_BDivhFKs',ADMIN='alineramirocontact@gmail.com';const $=id=>document.getElementById(id);let token=localStorage.getItem('aline_admin_token')||'';
function msg(id,text,bad=false){const e=$(id);e.textContent=text;e.classList.remove('hidden');e.style.background=bad?'#fff0ee':'#eef5ff'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function req(path,opt={}){const h={apikey:KEY,...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;if(opt.body&&!(opt.body instanceof FormData)&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(URL+path,{...opt,headers:h});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('Erro '+r.status));return data}
async function signUp(){const p=$('password').value;if(p.length<8)return msg('authStatus','Crie uma senha com pelo menos 8 caracteres.',true);msg('authStatus','Criando acesso...');try{await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:ADMIN,password:p,options:{emailRedirectTo:'https://alineramiro.com/admin.html'}})});msg('authStatus','Conta criada. Verifique o e-mail de Aline para confirmar o acesso. Depois volte aqui e pressione Entrar.')}catch(e){msg('authStatus',e.message,true)}}
async function signIn(){const p=$('password').value;if(!p)return msg('authStatus','Digite sua senha.',true);msg('authStatus','Entrando...');try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:ADMIN,password:p})});token=d.access_token;localStorage.setItem('aline_admin_token',token);showApp();await loadAll()}catch(e){msg('authStatus',e.message,true)}}
function showApp(){$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden')}function showLogin(){$('loginBox').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}
$('signUp').addEventListener('click',signUp);$('signIn').addEventListener('click',signIn);$('logout').onclick=()=>{token='';localStorage.removeItem('aline_admin_token');showLogin()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.section).classList.add('active')});
async function dbGet(table,order=''){return req('/rest/v1/'+table+'?select=*'+(order?'&order='+order:''),{headers:{Accept:'application/json'}})}async function dbInsert(table,obj){return req('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(obj)})}async function dbUpsert(table,obj){return req('/rest/v1/'+table+'?on_conflict=content_key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(obj)})}async function dbDelete(table,id){return req('/rest/v1/'+table+'?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}})}
async function upload(file,folder){if(!file)return null;const safe=file.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-');const path=folder+'/'+Date.now()+'-'+safe;const r=await fetch(URL+'/storage/v1/object/aline-public/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!r.ok){let x={};try{x=await r.json()}catch{}throw new Error(x.message||'No se pudo subir el archivo');}return URL+'/storage/v1/object/public/aline-public/'+path}
async function loadAll(){await Promise.all([loadContent(),loadMedia(),loadBooks(),loadProducts()])}async function loadContent(){try{const data=await dbGet('aline_site_content');data.forEach(r=>{if($(r.content_key))$(r.content_key).value=String(r.content_value||'').replace(/\\\\n/g,'\n')})}catch(e){msg('contentStatus',e.message,true)}}
$('saveContent').onclick=async()=>{try{for(const k of ['hero_roles_pt','bio_pt','training_title_pt','training_body_pt','training_cta_pt','training_contact_pt','contact_email'])await dbUpsert('aline_site_content',{content_key:k,content_value:$(k).value,updated_at:new Date().toISOString()});msg('contentStatus','Conteúdo salvo.')}catch(e){msg('contentStatus',e.message,true)}};
$('uploadMedia').onclick=async()=>{try{const f=$('mediaFile').files[0];if(!f)return msg('mediaStatus','Selecione uma foto.',true);msg('mediaStatus','Enviando...');const u=await upload(f,'photos');await dbInsert('aline_media',{media_type:'image',title:$('mediaTitle').value,file_url:u,alt_text:$('mediaAlt').value,placement:$('mediaPlacement').value,is_published:true,sort_order:Date.now()});msg('mediaStatus','Foto publicada.');$('mediaFile').value='';loadMedia()}catch(e){msg('mediaStatus',e.message,true)}};
async function loadMedia(){try{const d=await dbGet('aline_media','created_at.desc');$('mediaList').innerHTML=d.map(x=>`<div class="item"><img src="${esc(x.file_url)}"><div><strong>${esc(x.title||'Foto')}</strong><div class="small">${esc(x.placement)}</div></div><button class="btn danger" onclick="delRow('aline_media',${x.id})">Excluir</button></div>`).join('')}catch{}}
$('addBook').onclick=async()=>{try{if(!$('bookTitle').value)return msg('bookStatus','Digite o título.',true);const cover=await upload($('bookFile').files[0],'books');await dbInsert('aline_books',{title:$('bookTitle').value,subtitle:$('bookSubtitle').value,description:$('bookDescription').value,cover_url:cover,purchase_url:$('bookUrl').value,is_published:true,sort_order:Date.now()});msg('bookStatus','Livro adicionado.');loadBooks()}catch(e){msg('bookStatus',e.message,true)}};async function loadBooks(){try{const d=await dbGet('aline_books','sort_order.asc');$('bookList').innerHTML=d.map(x=>`<div class="item">${x.cover_url?`<img src="${esc(x.cover_url)}">`:'<div></div>'}<div><strong>${esc(x.title)}</strong><div class="small">${esc(x.subtitle||'')}</div></div><button class="btn danger" onclick="delRow('aline_books',${x.id})">Excluir</button></div>`).join('')}catch{}}
$('addProduct').onclick=async()=>{try{if(!$('productName').value)return msg('productStatus','Digite o nome.',true);const image=await upload($('productFile').files[0],'products');await dbInsert('aline_products',{name:$('productName').value,description:$('productDescription').value,image_url:image,purchase_url:$('productUrl').value,price_label:$('productPrice').value,is_published:true,sort_order:Date.now()});msg('productStatus','Produto adicionado.');loadProducts()}catch(e){msg('productStatus',e.message,true)}};async function loadProducts(){try{const d=await dbGet('aline_products','sort_order.asc');$('productList').innerHTML=d.map(x=>`<div class="item">${x.image_url?`<img src="${esc(x.image_url)}">`:'<div></div>'}<div><strong>${esc(x.name)}</strong><div class="small">${esc(x.price_label||'')}</div></div><button class="btn danger" onclick="delRow('aline_products',${x.id})">Excluir</button></div>`).join('')}catch{}}
window.delRow=async(t,id)=>{if(!confirm('Excluir este item?'))return;try{await dbDelete(t,id);loadAll()}catch(e){alert(e.message)}};
(async()=>{if(!token)return showLogin();try{const u=await req('/auth/v1/user');if((u.email||'').toLowerCase()===ADMIN){showApp();loadAll()}else{throw 0}}catch{token='';localStorage.removeItem('aline_admin_token');showLogin()}})();
</script></body></html>
