<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aline Ramiro | Administration</title><meta name="robots" content="noindex,nofollow"><style>:root{--navy:#061525;--blue:#1765d1;--soft:#f3f7fc;--ink:#0b1b2d;--text:#526579;--border:#d7e2ed;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--soft);color:var(--ink)}header{background:var(--navy);color:#fff;padding:20px}.wrap{width:min(1050px,92%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--border)}.btn.danger{background:var(--red)}main{padding:28px 0 70px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.langbox{border:1px solid var(--border);padding:16px;border-radius:10px}.langbox h3{margin:0 0 12px;color:var(--blue)}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px;font:inherit}textarea{min-height:140px}.status{display:none;padding:11px 12px;border-radius:8px;background:#eef5ff;margin:12px 0}.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}.item img{width:72px;height:72px;object-fit:cover;border-radius:8px}.small{font-size:13px;color:var(--text)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#fff;border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-weight:800}.tab.active{background:var(--navy);color:#fff}.section{display:none}.section.active{display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.item{grid-template-columns:58px 1fr}.item img{width:58px;height:58px}.item .btn{grid-column:1/-1}}</style></head><body><header><div class="wrap top"><div><div style="font-weight:950;letter-spacing:4px">ALINE RAMIRO</div><div style="font-size:11px;color:#8fc0ff;letter-spacing:2px">ADMINISTRATION</div></div><div><a class="btn secondary" href="/">View website</a> <button id="logout" class="btn danger" style="display:none">Sign out</button></div></div></header><main class="wrap"><section id="loginBox" class="panel"><h2>Administrative access</h2><div class="grid"><div><label>Email</label><input id="email" type="email" value="alineramirocontact@gmail.com" readonly></div><div><label>Password</label><input id="password" type="password"></div></div><div style="margin-top:14px"><button id="signIn" class="btn">Sign in</button> <button id="signUp" class="btn secondary">Create first access</button></div><div id="authStatus" class="status"></div></section><section id="app" style="display:none"><div class="tabs"><button class="tab active" data-section="content">Content</button><button class="tab" data-section="media">Photos</button><button class="tab" data-section="books">Books</button><button class="tab" data-section="products">Products</button></div><section id="content" class="section active panel"><h2>Website content</h2><div class="grid"><div class="langbox"><h3>English — Primary</h3><label>Roles</label><input id="hero_roles_en"><label>Biography</label><textarea id="bio_en"></textarea><label>Training title</label><input id="training_title_en"><label>Training text</label><textarea id="training_body_en"></textarea><label>CTA</label><input id="training_cta_en"><label>Contact text</label><textarea id="training_contact_en"></textarea></div><div class="langbox"><h3>Português</h3><label>Cargos</label><input id="hero_roles_pt"><label>Biografia</label><textarea id="bio_pt"></textarea><label>Título de treinamento</label><input id="training_title_pt"><label>Texto de treinamento</label><textarea id="training_body_pt"></textarea><label>Botão</label><input id="training_cta_pt"><label>Texto de contato</label><textarea id="training_contact_pt"></textarea></div><div class="full"><label>Contact email</label><input id="contact_email" type="email"></div></div><button id="saveContent" class="btn" style="margin-top:14px">Save content</button><div id="contentStatus" class="status"></div></section><section id="media" class="section panel"><h2>Photos</h2><div class="grid"><div class="full"><label>Image file</label><input id="mediaFile" type="file" accept="image/*"></div><div class="langbox"><h3>English — Primary</h3><label>Title</label><input id="mediaTitle"><label>Google / accessibility description</label><input id="mediaAlt"></div><div class="langbox"><h3>Português</h3><label>Título</label><input id="mediaTitlePt"><label>Descrição Google / acessibilidade</label><input id="mediaAltPt"></div><div class="full"><label>Where to display</label><select id="mediaPlacement"><option value="gallery">Gallery / Galeria</option><option value="hero">Main photo / Foto principal</option></select></div></div><button id="uploadMedia" class="btn" style="margin-top:14px">Upload and publish photo</button><div id="mediaStatus" class="status"></div><div id="mediaList"></div></section><section id="books" class="section panel"><h2>Books</h2><div class="grid"><div class="langbox"><h3>English — Primary</h3><label>Title</label><input id="bookTitle"><label>Subtitle</label><input id="bookSubtitle"><label>Description</label><textarea id="bookDescription"></textarea></div><div class="langbox"><h3>Português</h3><label>Título</label><input id="bookTitlePt"><label>Subtítulo</label><input id="bookSubtitlePt"><label>Descrição</label><textarea id="bookDescriptionPt"></textarea></div><div><label>Purchase link</label><input id="bookUrl" type="url"></div><div><label>Book cover</label><input id="bookFile" type="file" accept="image/*"></div></div><button id="addBook" class="btn" style="margin-top:14px">Add book</button><div id="bookStatus" class="status"></div><div id="bookList"></div></section><section id="products" class="section panel"><h2>Products</h2><div class="grid"><div class="langbox"><h3>English — Primary</h3><label>Name</label><input id="productName"><label>Description</label><textarea id="productDescription"></textarea></div><div class="langbox"><h3>Português</h3><label>Nome</label><input id="productNamePt"><label>Descrição</label><textarea id="productDescriptionPt"></textarea></div><div><label>Price</label><input id="productPrice"></div><div><label>Purchase link</label><input id="productUrl" type="url"></div><div class="full"><label>Image</label><input id="productFile" type="file" accept="image/*"></div></div><button id="addProduct" class="btn" style="margin-top:14px">Add product</button><div id="productStatus" class="status"></div><div id="productList"></div></section></section></main><script src="/admin.js?v=20260812-3" defer></script></body></html>
