a_pt||'Solicite um treinamento'):(content.training_cta_en||'Request a training');document.getElementById('trainingContact').textContent=currentLang==='pt'?(content.training_contact_pt||''):(content.training_contact_en||'');renderDynamic()}async function load(){const [c,b,p,m]=await Promise.all([db.from('aline_site_content').select('*'),db.from('aline_books').select('*').eq('is_published',true).order('sort_order'),db.from('aline_products').select('*').eq('is_published',true).order('sort_order'),db.from('aline_media').select('*').eq('is_published',true).order('sort_order')]);(c.data||[]).forEach(x=>content[x.content_key]=x.content_value);books=b.data||[];products=p.data||[];media=m.data||[];const email=content.contact_email||'alineramirocontact@gmail.com';document.getElementById('contactLink').href='mailto:'+email;document.getElementById('contactLink').textContent=email;applyLang()}document.getElementById('lang').onchange=e=>{currentLang=e.target.value;localStorage.setItem('alineLanguage',currentLang);applyLang()};const menu=document.getElementById('menu'),mobile=document.getElementById('mobile');menu.onclick=()=>mobile.classList.toggle('open');let taps=0,timer;document.getElementById('adminTrigger').onclick=()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,3500);if(taps>=10)location.href='/admin.html'};load();</script></body></html>
